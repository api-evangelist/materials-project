components:
  schemas:
    PhononComputationalSettings:
      properties:
        npoints_band:
          anyOf:
          - type: integer
          - type: 'null'
          title: Npoints Band
          description: number of points for band structure computation
        kpath_scheme:
          anyOf:
          - type: string
          - type: 'null'
          title: Kpath Scheme
          description: indicates the kpath scheme
        kpoint_density_dos:
          anyOf:
          - type: integer
          - type: 'null'
          title: Kpoint Density Dos
          description: number of points for computation of free energies and densities of states
      type: object
      title: PhononComputationalSettings
      description: Collection to store computational settings for the phonon computation.
    Response_PhononBSDOSDoc_:
      properties:
