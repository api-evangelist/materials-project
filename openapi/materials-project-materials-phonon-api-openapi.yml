            - type: number
            type: array
            maxItems: 3
            minItems: 3
          type: object
          title: Labels Dict
          description: The high-symmetry labels of specific q-points.
          default: {}
        qpoints:
          items:
            prefixItems:
            - type: number
            - type: number
            - type: number
            type: array
            maxItems: 3
            minItems: 3
          type: array
          title: Qpoints
          description: The wave vectors (q-points) at which the band structure was sampled, in direct coordinates.
        reciprocal_lattice:
          prefixItems:
          - prefixItems:
            - type: number
            - type: number
            - type: number
            type: array
            maxItems: 3
            minItems: 3
          - prefixItems:
            - type: number
            - type: number
            - type: number
            type: array
            maxItems: 3
            minItems: 3
          - prefixItems:
            - type: number
            - type: number
            - type: number
            type: array
            maxItems: 3
