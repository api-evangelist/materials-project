          default: 100
          title: ' Limit'
        description: Max number of entries to return in a single query. Limited to 1000.
      - name: _fields
        in: query
        required: false
        schema:
          type: string
          description: 'Fields to project from MaterialsDoc as a list of comma separated strings.                    Fields include: `builder_meta` `nsites` `elements` `nelements` `composition` `composition_reduced` `formula_pretty` `formula_anonymous` `chemsys` `volume` `density` `density_atomic` `symmetry` `material_id` `deprecated` `deprecation_reasons` `last_updated` `origins` `warnings` `structure` `initial_structures` `task_ids` `deprecated_tasks` `calc_types` `created_at` `task_types` `run_types` `entries`'
          title: ' Fields'
        description: 'Fields to project from MaterialsDoc as a list of comma separated strings.                    Fields include: `builder_meta` `nsites` `elements` `nelements` `composition` `composition_reduced` `formula_pretty` `formula_anonymous` `chemsys` `volume` `density` `density_atomic` `symmetry` `material_id` `deprecated` `deprecation_reasons` `last_updated` `origins` `warnings` `structure` `initial_structures` `task_ids` `deprecated_tasks` `calc_types` `created_at` `task_types` `run_types` `entries`'
      - name: _all_fields
        in: query
        required: false
        schema:
          type: boolean
          description: Include all fields.
          default: false
          title: ' All Fields'
        description: Include all fields.
      - name: license
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - BY-C
            - BY-NC
            - All
            type: string
          - type: 'null'
          description: Query by license. Can be commercial or non-commercial, or both
          default: BY-C
          title: License
        description: Query by license. Can be commercial or non-commercial, or both
      - name: batch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Query by batch identifier
          title: Batch Id
        description: Query by batch identifier
      - name: batch_id_not_eq
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exclude batch identifier
          title: Batch Id Not Eq
        description: Exclude batch identifier
      - name: batch_id_eq_any
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Query by a comma-separated list of batch identifiers
          title: Batch Id Eq Any
        description: Query by a comma-separated list of batch identifiers
      - name: batch_id_neq_any
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exclude a comma-separated list of batch identifiers
          title: Batch Id Neq Any
        description: Exclude a comma-separated list of batch identifiers
      responses:
        '200':
          description: Search for a MaterialsDoc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_MaterialsDoc_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
