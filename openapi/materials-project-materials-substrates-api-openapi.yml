          title: ' Fields'
        description: 'Fields to project from SubstratesDoc as a list of comma separated strings.                    Fields include: `sub_form` `sub_id` `film_orient` `area` `energy` `film_id` `norients` `orient`'
      - name: _all_fields
        in: query
        required: false
        schema:
          type: boolean
          description: Include all fields.
          default: false
          title: ' All Fields'
        description: Include all fields.
      responses:
        '200':
          description: Search for a SubstratesDoc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_SubstratesDoc_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Response_SubstratesDoc_:
      properties:
        data:
          anyOf:
          - items:
              $ref: '#/components/schemas/SubstratesDoc'
            type: array
          - type: 'null'
          title: Data
          description: List of returned data
        errors:
          anyOf:
          - items:
              $ref: '#/components/schemas/Error'
            type: array
          - type: 'null'
          title: Errors
          description: Any errors on processing this query
        meta:
          anyOf:
          - $ref: '#/components/schemas/Meta'
          - type: 'null'
          description: Extra information for the query
      type: object
      title: Response[SubstratesDoc]
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Meta:
      properties:
        api_version:
          type: string
          title: Api Version
          description: A string containing the version of the Materials API implementation, e.g. v0.9.5
          default: 0.86.4rc5.dev1+g77c2c1315
        time_stamp:
          type: string
          format: date-time
          title: Time Stamp
          description: A string containing the date and time at which the query was executed
        total_doc:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Total Doc
          description: The total number of documents available for this query
        facet:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Facet
          description: A dictionary containing the facets available for this query
      additionalProperties: true
      type: object
      title: Meta
      description: Meta information for the MAPI Response.
    SubstratesDoc:
      properties:
        sub_form:
          anyOf:
          - type: string
          - type: 'null'
          title: Sub Form
          description: Reduced formula of the substrate.
        sub_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sub Id
          description: 'Materials Project ID of the substrate material. This comes in the form: mp-******.'
        film_orient:
          anyOf:
          - type: string
          - type: 'null'
          title: Film Orient
          description: Surface orientation of the film material.
        area:
          anyOf:
          - type: number
          - type: 'null'
          title: Area
          description: Minimum coincident interface area in Å².
        energy:
          anyOf:
          - type: number
          - type: 'null'
          title: Energy
          description: Elastic energy in meV.
        film_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Film Id
          description: 'The Materials Project ID of the film material. This comes in the form: mp-******.'
        _norients:
          anyOf:
          - type: integer
          - type: 'null'
          title: Norients
          description: Number of possible surface orientations for the substrate.
        orient:
          anyOf:
          - type: string
          - type: 'null'
          title: Orient
          description: Surface orientation of the substrate material.
      type: object
      title: SubstratesDoc
      description: Possible growth substrates for a given material.
    Error:
      properties:
        code:
          type: integer
          title: Code
          description: The error code
        message:
          type: string
          title: Message
          description: The description of the error
      type: object
      required:
      - code
      - message
      title: Error
      description: Base Error model for General API.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    ApiKeyAuth:
      descriptions: MP API key to authorize requests
      name: X-API-KEY
      in: header
      type: apiKey
