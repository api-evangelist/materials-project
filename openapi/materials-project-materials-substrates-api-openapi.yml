        description: Query for maximum value of energy
      - name: energy_min
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Query for minimum value of energy
          title: Energy Min
        description: Query for minimum value of energy
      - name: norients_max
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Query for maximum value of norients
          title: Norients Max
        description: Query for maximum value of norients
      - name: norients_min
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Query for minimum value of norients
          title: Norients Min
        description: Query for minimum value of norients
      - name: norients
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
