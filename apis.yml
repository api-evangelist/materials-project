- aid: materials-project:materials-project-materials-tasks-api
  name: Materials Project Materials Tasks API
  description: >-
    Route for "core" information associated with a given calculation in the Materials Project             database.
    Multiple calculations can ultimately be associated with a unique material, and are the source             of
    its reported properties. The unique identifier for a calculation is its `task_id`. Note             that
    the `material_id` chosen for a given material is sourced from one of the `task_id` values             associated
    with it. Core data in this context refers to calculation quantities such as parsed input             and
    output data (e.g. VASP input flags, atomic forces, structures) and runtime statistics. See the             `TaskDoc`
    schema for a full list of fields returned by this route.
  humanURL: https://next-gen.materialsproject.org/api
  baseURL: https://api.materialsproject.org
  tags:
  - Materials Tasks
  properties:
  - type: OpenAPI
    url: openapi/materials-project-materials-tasks-api-openapi.yml
  - type: Documentation
    url: https://next-gen.materialsproject.org/api
  - type: GettingStarted
    url: https://docs.materialsproject.org/downloading-data/using-the-api
