- aid: materials-project:materials-project-materials-electronic-structure-api
  name: Materials Project Materials Electronic Structure API
  description: >-
    Routes providing computed electronic structure related data for a material such as             band
    gap and fermi level. Python objects for line-mode band structures, density of states, and             fermi
    surfaces are also available. This data was obtained following the methodology discussed by             [Munro
    *et al.*](https://doi.org/10.1038/s41524-020-00383-7) and [Ganose *et al.*](https://doi.org/10.21105/joss.03089)             Note
    that full band structure, density of states, and fermi surface data has not been calculated for             all
    materials in the Materials Project database. See the `ElectronicStructureDoc` and `FermiDoc` schema             for
    a full list of fields returned by the associated routes.
  humanURL: https://next-gen.materialsproject.org/api
