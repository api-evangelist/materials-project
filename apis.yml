- aid: materials-project:materials-project-materials-api
  name: Materials Project Materials API
  description: >-
    Route for "core" information associated with a given material in the Materials Project             database.
    The unique identifier for a material is its `material_id` (e.g. `mp-149`). Core data in             this
    context refers to the crystal structure, information associated with it such as the density             and
    chemical formula, and the associated calculations which are identified with unique `task_id`             values.
    It does not contain any materials properties such as the formation energy or band gap, please             consult
    other property-specific endpoints for this information. See the `MaterialsDoc` schema for             a
    full list of fields returned by this route.
  humanURL: https://next-gen.materialsproject.org/api
  baseURL: https://api.materialsproject.org
  tags:
  - Materials
  properties:
  - type: OpenAPI
    url: openapi/materials-project-materials-api-openapi.yml
  - type: Documentation
    url: https://next-gen.materialsproject.org/api
  - type: GettingStarted
    url: https://docs.materialsproject.org/downloading-data/using-the-api
